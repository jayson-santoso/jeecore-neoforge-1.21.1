# Expanded by generateModMetadata using gradle.properties.

# Loader and licensing.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Mod identity.
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
A core mod for Jee's Pack
'''

# Minecraft behavior hooks.
[[mixins]]
config="${mod_id}.mixins.json"

# Runtime dependencies.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
