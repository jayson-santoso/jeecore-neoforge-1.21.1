plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep wrapper distribution settings in the build script.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Keep authoring files and datagen caches out of the published mod.
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = "C4's Maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Isolate each development environment under the ignored runs directory.
    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Keep the second client's saves and settings separate.
            gameDirectory = project.file('runs/client2')
            // Distinguish the second client during multiplayer development.
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Executes registered local GameTests; test sources must be present.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('runs/data')

            // Write generated data beside main sources and use existing resources as input.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Enable registry diagnostics for development runs.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Bind production sources to the mod loaded in development runs.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Keep development-only runtime dependencies separate from published dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Expand mod metadata placeholders from gradle.properties during resource generation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Use the same generated metadata for Gradle builds and IDE launches.
sourceSets.main.resources.srcDir generateModMetadata
// Refresh metadata during IDE synchronization.
neoForge.ideSyncTask generateModMetadata

// Publish development artifacts into the ignored local Maven repository.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Local test sources are ignored by Git and excluded from the published jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

// Development runs can discover these tests; the published main jar excludes them.
if (file('src/gameTest').isDirectory()) {
    neoForge.mods.jeecore.sourceSet sourceSets.gameTest
}
neoForge.runs.gameTestServer.gameDirectory = project.file('runs/gametest')
def infernalRageRegressionTest = tasks.register('infernalRageRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks rage state and concurrent activation/removal for crash regressions.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'net.sonflowers.jeecore.gene.infernal.InfernalRageRegressionTest'
    onlyIf('local Infernal regression source exists') {
        file('src/regression/java/net/sonflowers/jeecore/gene/infernal/InfernalRageRegressionTest.java').isFile()
    }
    dependsOn tasks.named('regressionClasses')
}
def windrunnerRegressionTest = tasks.register('windrunnerRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks Windrunner momentum progression and bounded air control.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'net.sonflowers.jeecore.gene.nimbus.WindrunnerRegressionTest'
    onlyIf('local Windrunner regression source exists') {
        file('src/regression/java/net/sonflowers/jeecore/gene/nimbus/WindrunnerRegressionTest.java').isFile()
    }
    dependsOn tasks.named('regressionClasses')
}

tasks.named('check') {
    dependsOn infernalRageRegressionTest
    dependsOn windrunnerRegressionTest
    dependsOn tasks.named('gameTestClasses')
}

// Include dependency sources and Javadoc in IntelliJ project imports.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Scoop exposes the Gradle cache through directory junctions. Mixing those aliases
// between IDE launch files and the legacy classpath loads FML modules twice.
def cacheAlias = gradle.gradleUserHomeDir.absolutePath
def canonicalCache = gradle.gradleUserHomeDir.toPath().toRealPath().toString()
tasks.configureEach { task ->
    if (task.name.endsWith('LegacyClasspath') || task.name.matches('prepare.*Run')) {
        task.doLast {
            task.outputs.files.files.findAll { it.isFile() && it.name.endsWith('.txt') }.each { launchFile ->
                def original = launchFile.getText('UTF-8')
                def normalized = original
                        .replace(cacheAlias.replace('\\', '\\\\'), canonicalCache.replace('\\', '\\\\'))
                        .replace(cacheAlias, canonicalCache)
                if (normalized != original) launchFile.setText(normalized, 'UTF-8')
            }
        }
    }

}
