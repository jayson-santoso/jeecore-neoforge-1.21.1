# Shared build settings and mod metadata.

# Gradle execution.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mapping versions must target the same Minecraft release.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft and NeoForge compatibility.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
loader_version_range=[1,)

# Mod identity; mod_id must match JeeCore.MOD_ID and resource namespaces.
mod_id=jeecore
mod_name=Jee's Core Mod
mod_license=MIT
mod_version=1.0.0

# Maven group matches the base Java package.
mod_group_id=net.sonflowers.jeecore
